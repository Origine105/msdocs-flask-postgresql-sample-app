<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    {% block head %}
        <title>Azure Cloud Image Viewer – {% block title %}{% endblock %}</title>

        <!-- Bootstrap CSS -->
        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous"
        />

        <!-- Custom Styles to avoid overlap with fixed navbar -->
        <style>
          body {
            padding-top: 70px;    /* Altura aproximada de la navbar */
            background-color: #f8f9fa;
          }
        </style>

        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    {% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-primary fixed-top shadow-sm">
        <div class="container">
          <a class="navbar-brand" href="{{ url_for('viewer') }}">
            <i class="fas fa-cloud-upload-alt"></i>
            Azure Image Viewer
          </a>
          <button class="navbar-toggler" type="button"
                  data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                  aria-controls="navbarCollapse" aria-expanded="false"
                  aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarCollapse">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('viewer') }}">Registros</a>
              </li>
            </ul>
          </div>
        </div>
    </nav>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kaPo0ZgCO+zE3v1WcK6vhBiUOzY+U4zLoebjdH2f1ujZ196dMXdc5XzOAuspR/Ke"
      crossorigin="anonymous"
    ></script>
</body>
</html>
